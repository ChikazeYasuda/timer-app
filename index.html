<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Timer App</title>

    <!-- CSSを読み込む -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- ======================================== -->
    <!-- 秒数設定画面 -->
    <!-- ======================================== -->

    <div
        id="setupScreen"
        class="screen"
    >

        <h1>Timer</h1>

        <p>
            カウントダウンする秒数を入力してください
        </p>

        <!-- 秒数入力 -->
        <input
            id="secondsInput"
            type="number"
            min="1"
            step="1"
            placeholder="秒"
        >

        <!-- タイマー画面へ移動 -->
        <button
            id="setButton"
        >
            タイマーへ
        </button>

    </div>



    <!-- ======================================== -->
    <!-- タイマー画面 -->
    <!-- ======================================== -->

    <div
        id="timerScreen"
        class="screen hidden"
    >

        <!-- ==================================== -->
        <!-- 残り秒数 -->
        <!-- ==================================== -->

        <div
            id="countdown"
        >
            0
        </div>



        <!-- ==================================== -->
        <!-- 赤い大型ボタン -->
        <!-- ==================================== -->

        <div
            class="buttonAssembly"
        >

            <!-- 金属プレート -->
            <div
                class="metalPlate"
            >

                <!-- ============================ -->
                <!-- 4本のネジ -->
                <!-- ============================ -->

                <div
                    class="screw screwTopLeft"
                ></div>

                <div
                    class="screw screwTopRight"
                ></div>

                <div
                    class="screw screwBottomLeft"
                ></div>

                <div
                    class="screw screwBottomRight"
                ></div>


                <!-- ============================ -->
                <!-- 黒いボタン台座 -->
                <!-- ============================ -->

                <div
                    class="buttonBezel"
                >

                    <!-- ======================== -->
                    <!-- 赤いStartボタン -->
                    <!-- 文字は表示しない -->
                    <!-- ======================== -->

                    <button
                        id="startButton"
                        class="startButton"
                        aria-label="Start"
                    ></button>

                </div>

            </div>

        </div>



        <!-- ==================================== -->
        <!-- Pauseボタン -->
        <!-- 実際の機能はReset -->
        <!-- ==================================== -->

        <button
            id="resetButton"
            class="pauseButton"
        >
            Pause
        </button>

    </div>



    <!-- ======================================== -->
    <!-- アラーム音 -->
    <!-- ======================================== -->

    <audio
        id="alarmSound"
        src="alarm.mp3"
        preload="auto"
        loop
    ></audio>



    <!-- ======================================== -->
    <!-- JavaScriptを読み込む -->
    <!-- ======================================== -->

    <script
        src="script.js"
    ></script>

</body>

</html>
