<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Timer App</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ======================================== -->
    <!-- 秒数設定画面 -->
    <!-- ======================================== -->

    <div
        id="setupScreen"
        class="screen"
    >

        <h1>Timer</h1>

        <p>
            カウントダウンする秒数を入力してください
        </p>

        <!-- 0.01秒単位で入力可能 -->
        <input
            id="secondsInput"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="秒"
        >

        <button id="setButton">
            タイマーへ
        </button>

    </div>


    <!-- ======================================== -->
    <!-- タイマー画面 -->
    <!-- ======================================== -->

    <div
        id="timerScreen"
        class="screen hidden"
    >

        <!-- 残り秒数 -->
        <div id="countdown">
            0.00
        </div>


        <!-- ==================================== -->
        <!-- 大型赤ボタン -->
        <!-- ==================================== -->

        <div class="buttonAssembly">

            <div class="metalPlate">

                <!-- 4本のネジ -->
                <div class="screw screwTopLeft"></div>
                <div class="screw screwTopRight"></div>
                <div class="screw screwBottomLeft"></div>
                <div class="screw screwBottomRight"></div>


                <!-- 黒いボタン台座 -->
                <div class="buttonBezel">

                    <!-- Startボタン -->
                    <button
                        id="startButton"
                        class="startButton"
                        aria-label="Start"
                    ></button>

                </div>

            </div>

        </div>


        <!-- ==================================== -->
        <!-- Pauseボタン -->
        <!-- 実際にはReset -->
        <!-- ==================================== -->

        <button
            id="resetButton"
            class="pauseButton"
        >
            Pause
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
